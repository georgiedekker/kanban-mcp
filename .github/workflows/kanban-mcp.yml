name: kanban-mcp

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Load environment variables
        run: |
          if [ -f /home/air/Movies/kanban/.env ]; then
            source /home/air/Movies/kanban/.env
            echo "Environment variables loaded from /home/air/Movies/kanban/.env"
          else
            echo "Warning: .env file not found at /home/air/Movies/kanban/.env"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
