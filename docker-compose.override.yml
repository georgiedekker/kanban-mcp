services:
  planka:
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/kanban
    depends_on:
      - db
    networks:
      - default

  db:
    image: postgres:18-alpine
    container_name: kanban-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kanban
    ports:
      - "5448:5432"  # choose a free host port
    volumes:
      - kanban_db_data:/var/lib/postgresql/data
    networks:
      - default

volumes:
  kanban_db_data:
